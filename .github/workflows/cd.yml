name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/parsasamiei/iranopen-insitu-scs-app:latest
            ghcr.io/parsasamiei/iranopen-insitu-scs-app:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /opt/iranopen-insitu
            success=false
            for i in 1 2 3 4 5 6 7 8; do
              if docker compose pull app; then
                success=true
                break
              fi
              echo "pull attempt $i failed, retrying..."
              sleep $((i * 5))
            done
            if [ "$success" = false ]; then
              echo "::error::Failed to pull new image after 8 attempts — aborting, still running previous version"
              exit 1
            fi
            docker compose up -d app
            docker image prune -f
